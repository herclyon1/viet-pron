<main>
  <h1>越南语发音</h1>
  <form id="f" autocomplete="off">
    <input id="q" type="search" lang="vi" inputmode="text" enterkeyhint="search"
           autocapitalize="none" autocorrect="off" spellcheck="false"
           placeholder="输入越南语，例如 xin chào">
  </form>
  <p class="legend">每个音节拆成几块，每块照那门语言读：黑字照拼音（ê 是「也 yě」里的 e），<span class="p-en">蓝字照英语（英式，aw 像 law）</span>，假名照日语，<span class="p-vn">橙字</span>是中英日都没有的越南语音（听播放）；小号假名只发辅音；上下叠着的两个音同时发；' 两边分开读；·e 照轻声读（像「的 de」）；调号跟拼音一样标在元音头上，ッ 是嗓子卡一下（照日语读）。</p>
  <p id="status" class="status" hidden></p>
  <p id="astatus" class="status" hidden></p>
  <section id="out" aria-live="polite"></section>
  <footer class="credit">声音是语音合成，不是真人录音：Piper 越南语北部口音声音 vais1000（训练数据 VAIS-1000，CC BY 4.0），浏览器内生成。</footer>
</main>
